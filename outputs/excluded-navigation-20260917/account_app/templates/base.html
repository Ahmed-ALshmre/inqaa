<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <script>window.workspacePerson = {{ staff_person|tojson }};</script>
  <script src="/static/js/workspace.js?v=1"></script>
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="صوف">
  <title>{% block title %}صوف{% endblock %}</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png?v=6">
  <link rel="icon" type="image/png" href="/static/icons/icon-192.png?v=6">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/dashboard.css?v=19">
  {% block styles %}{% endblock %}
  <link rel="stylesheet" href="/static/css/workspace.css?v=1">
  <link rel="stylesheet" href="/static/css/rewards.css?v=1">
  <script defer src="/static/js/rewards.js?v=1"></script>
  <link rel="stylesheet" href="/static/css/navigation.css?v=1">
  <script defer src="/static/js/navigation.js?v=1"></script>
</head>
<body class="admin-shell">
  <nav class="admin-topbar">
    <button class="admin-menu-btn" type="button" onclick="toggleAdminNav()" aria-label="القائمة">
      <i class="bi bi-list"></i>
    </button>
    <button class="app-back-btn" type="button" onclick="appGoBack()" aria-label="رجوع"><i class="bi bi-chevron-right"></i></button>
    <a class="admin-brand" href="/dashboard">
      <img class="app-brand-logo" src="/static/icons/icon-192.png?v=6" alt="شعار صوف">
      <span>صوف</span>
    </a>
    <button class="quick-nav-trigger" type="button" data-open-navigation aria-label="انتقال سريع بين الصفحات" aria-haspopup="dialog"><i class="bi bi-search"></i><span class="quick-nav-label">انتقال سريع</span><kbd>⌘ / Ctrl K</kbd></button>
    {% include "_rewards_bar.html" %}
    <div class="admin-topbar-actions"><span class="workspace-user">{{ staff_person.name if staff_person else '' }}</span>
      <a class="btn btn-outline-light btn-sm" href="/settings/maintenance"><i class="bi bi-shield-check"></i><span>نسخة احتياطية</span></a>
      <a class="btn btn-outline-light btn-sm" href="/logout"><i class="bi bi-box-arrow-left"></i><span>خروج</span>
      </a>
    </div>
  </nav>

  <button class="admin-floating-menu" type="button" onclick="toggleAdminNav()" aria-label="القائمة">
    <i class="bi bi-list"></i>
  </button>

  <div class="admin-overlay" id="adminOverlay" onclick="closeAdminNav()"></div>
  <aside class="admin-sidebar" id="adminSidebar">
    <div class="p-3"><label for="globalStoreSelect" class="small mb-2">المتجر الحالي</label><select id="globalStoreSelect" class="form-select form-select-sm" disabled><option>جاري تحميل المتاجر…</option></select></div>
    <nav aria-label="صفحات مساحة العمل">{% include "_page_links.html" %}</nav>
  </aside>

  <main class="admin-main">
    {% block content %}{% endblock %}
  </main>



  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/admin_pages.js?v=6"></script>
  <script src="/static/js/mobile_app.js?v=4"></script>
  {% block scripts %}{% endblock %}
  {% include "_quick_navigation.html" %}
  <div class="navigation-loading" aria-hidden="true"></div>
</body>
</html>
