<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>الطلبات — صوف</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png?v=6">
  <link rel="icon" href="/static/icons/icon-192.png?v=6">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/dashboard.css?v=17">
</head>
<body class="orders-page">
  <nav class="navbar navbar-dark navbar-custom fixed-top px-3">
    <div class="nav-main d-flex align-items-center gap-2">
      <span class="navbar-brand fw-bold fs-6 mb-0">
        <img class="app-brand-logo me-2" src="/static/icons/icon-192.png?v=6" alt="شعار صوف">طلبات صوف
      </span>
    </div>
    <div class="nav-actions d-flex align-items-center gap-2">
      <a class="btn btn-outline-light btn-sm" href="/dashboard">
        <i class="bi bi-chat-dots me-1"></i>الداشبورد
      </a>
      <a class="btn btn-outline-light btn-sm" href="/products">
        <i class="bi bi-box-seam me-1"></i>المنتجات
      </a>
      <a class="btn btn-outline-light btn-sm mobile-optional" href="/settings/maintenance" title="النسخ الاحتياطي"><i class="bi bi-shield-check"></i><span>النسخ</span></a>
      <a class="btn btn-outline-light btn-sm" href="/logout"><i class="bi bi-box-arrow-left"></i><span>خروج</span></a>
      <a class="btn btn-outline-light btn-sm" href="/settings" title="الإعدادات">
        <i class="bi bi-gear me-1"></i><span>الإعدادات</span>
      </a>
      <button class="btn btn-outline-light btn-sm" onclick="loadOrders()">
        <i class="bi bi-arrow-clockwise"></i>
      </button>
    </div>
  </nav>

  <main class="orders-layout">
    <section class="orders-header">
      <div>
        <div class="fw-bold fs-5">كل الطلبات</div>
        <div class="small" style="color:var(--text-muted)">الطلبات المثبتة من AI أو من الداشبورد تظهر هنا</div>
      </div>
      <div class="orders-stats">
        <div class="orders-stat">
          <span id="ordersTotal">0</span>
          <small>إجمالي</small>
        </div>
        <div class="orders-stat">
          <span id="ordersNew">0</span>
          <small>جديد</small>
        </div>
        <div class="orders-stat">
          <span id="ordersPeople">0</span>
          <small>أشخاص</small>
        </div>
        <div class="orders-stat">
          <span id="ordersConversion">0%</span>
          <small>تحويل</small>
        </div>
      </div>
    </section>

    <section class="orders-toolbar">
      <div class="row g-2 align-items-center">
        <div class="col-md-6">
          <div class="input-group input-group-sm">
            <span class="input-group-text border-0"><i class="bi bi-search" style="color:var(--text-muted)"></i></span>
            <input type="text" class="form-control border-0" id="orderSearch"
              placeholder="بحث بالاسم، الهاتف، المنتج، المحافظة..." oninput="renderOrders()">
          </div>
        </div>
        <div class="col-md-6 d-flex gap-2">
          <div class="input-group input-group-sm">
            <span class="input-group-text border-0 bg-transparent text-white">من:</span>
            <input type="date" class="form-control border-0" id="orderDateFrom" onchange="loadOrders()">
          </div>
          <div class="input-group input-group-sm">
            <span class="input-group-text border-0 bg-transparent text-white">إلى:</span>
            <input type="date" class="form-control border-0" id="orderDateTo" onchange="loadOrders()">
          </div>
        </div>
      </div>
    </section>

    <section class="orders-table-wrap">
      <div class="table-responsive">
        <table class="table table-dark table-hover align-middle orders-table mb-0">
          <thead>
            <tr>
              <th>#</th>
              <th>الوقت</th>
              <th>الزبون</th>
              <th>الهاتف</th>
              <th>المنتج</th>
              <th>المحافظة</th>
              <th>العنوان</th>
              <th>القياس</th>
              <th>الحالة</th>
              <th>إجراءات</th>
            </tr>
          </thead>
          <tbody id="ordersBody">
            <tr class="orders-empty-row">
              <td colspan="10" class="text-center py-5" style="color:var(--text-muted)">
                <div class="spinner-border spinner-border-sm mb-2"></div>
                <strong>جاري تحميل الطلبات...</strong>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="modal fade" id="orderEditModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <form id="orderEditForm">
          <div class="modal-header">
            <h5 class="modal-title">تعديل الطلب</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="إغلاق"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="editOrderId">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">اسم الزبون</label>
                <input class="form-control" id="editCustomerName">
              </div>
              <div class="col-md-6">
                <label class="form-label">الهاتف</label>
                <input class="form-control" id="editPhone" dir="ltr">
              </div>
              <div class="col-md-6">
                <label class="form-label">المحافظة</label>
                <input class="form-control" id="editProvince">
              </div>
              <div class="col-md-6">
                <label class="form-label">الحالة</label>
                <select class="form-select" id="editStatus">
                  <option value="new">new</option>
                  <option value="confirmed">confirmed</option>
                  <option value="sent">sent</option>
                  <option value="delivered">delivered</option>
                  <option value="cancelled">cancelled</option>
                </select>
              </div>
              <div class="col-12">
                <label class="form-label">العنوان</label>
                <textarea class="form-control" id="editAddress" rows="2"></textarea>
              </div>
              <div class="col-md-6">
                <label class="form-label">اسم المنتج</label>
                <input class="form-control" id="editProductName">
              </div>
              <div class="col-md-6">
                <label class="form-label">Product ID</label>
                <input class="form-control" id="editProductId" dir="ltr">
              </div>
              <div class="col-md-6">
                <label class="form-label">اللون</label>
                <input class="form-control" id="editColor">
              </div>
              <div class="col-md-6">
                <label class="form-label">القياس</label>
                <input class="form-control" id="editSize">
              </div>
              <div class="col-12">
                <label class="form-label">ملاحظات</label>
                <textarea class="form-control" id="editNotes" rows="2"></textarea>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <span class="small me-auto" id="orderEditStatus" style="color:var(--text-muted)"></span>
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">إلغاء</button>
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-save me-1"></i>حفظ
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  {% include '_mobile_nav.html' %}
  <div class="toast-container position-fixed bottom-0 start-0 p-3" id="ordersToastContainer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/mobile_app.js?v=2"></script>
  <script src="/static/js/orders.js?v=9"></script>
</body>
</html>
