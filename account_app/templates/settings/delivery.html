{% extends "base.html" %}
{% block title %}إعدادات التوصيل{% endblock %}
{% block content %}
<section class="admin-page-head">
  <div>
    <p class="admin-kicker">الإعدادات</p>
    <h1>أجور التوصيل</h1>
    <p>أجور ومدة توصيل مستقلة لكل متجر. اختر المتجر قبل التعديل.</p>
  </div>
</section>

<section class="admin-panel">
  <label class="form-label" for="deliveryStoreSelect">المتجر</label>
  <select class="form-select mb-3" id="deliveryStoreSelect"></select>
  <form id="deliverySettingsForm" class="admin-form">
    <label class="form-label" for="baghdadFee">أجور بغداد (دينار عراقي)</label>
    <input class="form-control" id="baghdadFee" type="number" min="0" step="1" required>
    <label class="form-label" for="otherFee">أجور باقي المحافظات (دينار عراقي)</label>
    <input class="form-control" id="otherFee" type="number" min="0" step="1" required>
    <label class="form-label" for="deliveryTime">مدة التوصيل المعتمدة لهذا المتجر</label>
    <input class="form-control" id="deliveryTime" placeholder="اتركها فارغة إذا لم تُحدد المدة">
    <label class="form-label">التوصيل السريع</label>
    <div><input id="fastDelivery" type="checkbox"> فعال</div>
    <label class="form-label">نص رسالة الفحص عند الاستلام</label>
    <textarea class="form-control" id="inspectionMessage" rows="4"></textarea>
    <button class="btn btn-primary" type="submit"><i class="bi bi-save"></i> حفظ</button>
    <span class="admin-status" id="deliverySettingsStatus"></span>
  </form>
</section>
{% endblock %}
{% block scripts %}
<script src="/static/js/settings_pages.js?v=9"></script>
<script>initDeliveryPage();</script>
{% endblock %}
