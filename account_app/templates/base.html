<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="صوف">
  <title>{% block title %}صوف{% endblock %}</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png?v=6">
  <link rel="icon" type="image/png" href="/static/icons/icon-192.png?v=6">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/dashboard.css?v=17">
</head>
<body class="admin-shell">
  <nav class="admin-topbar">
    <button class="admin-menu-btn" type="button" onclick="toggleAdminNav()" aria-label="القائمة">
      <i class="bi bi-list"></i>
    </button>
    <button class="app-back-btn" type="button" onclick="appGoBack()" aria-label="رجوع"><i class="bi bi-chevron-right"></i></button>
    <a class="admin-brand" href="/dashboard">
      <img class="app-brand-logo" src="/static/icons/icon-192.png?v=6" alt="شعار صوف">
      <span>صوف</span>
    </a>
    <div class="admin-topbar-actions">
      <a class="btn btn-outline-light btn-sm" href="/settings/maintenance"><i class="bi bi-shield-check"></i><span>نسخة احتياطية</span></a>
      <a class="btn btn-outline-light btn-sm" href="/logout"><i class="bi bi-box-arrow-left"></i><span>خروج</span>
      </a>
    </div>
  </nav>

  <button class="admin-floating-menu" type="button" onclick="toggleAdminNav()" aria-label="القائمة">
    <i class="bi bi-list"></i>
  </button>

  <div class="admin-overlay" id="adminOverlay" onclick="closeAdminNav()"></div>
  <aside class="admin-sidebar" id="adminSidebar">
    <div class="admin-sidebar-title">التنقل</div>
    <a href="/dashboard"><i class="bi bi-chat-heart"></i> المحادثات والعملاء</a>
    <a href="/orders"><i class="bi bi-receipt"></i> الطلبات</a>
    <a href="/products"><i class="bi bi-box-seam"></i> المنتجات</a>
    <a href="/settings"><i class="bi bi-gear"></i> الإعدادات</a>
    <div class="admin-sidebar-title mt-3">الإعدادات</div>
    <a href="/settings/ai"><i class="bi bi-robot"></i> الذكاء الاصطناعي</a>
    <a href="/advisor"><i class="bi bi-chat-square-heart"></i> مستشار صوف</a>
    <a href="/settings/auto-product"><i class="bi bi-magic"></i> المنتج الافتراضي</a>
    <a href="/settings/catalog"><i class="bi bi-images"></i> صور الكتالوج</a>
    <a href="/settings/followup"><i class="bi bi-send"></i> المتابعة</a>
    <a href="/settings/channels"><i class="bi bi-broadcast"></i> الربط والقنوات</a>
    <a href="/settings/store"><i class="bi bi-shop-window"></i> بيانات المتجر</a>
    <a href="/settings/maintenance"><i class="bi bi-shield-check"></i> النسخ الاحتياطي</a>
  </aside>

  <main class="admin-main">
    {% block content %}{% endblock %}
  </main>

  {% include '_mobile_nav.html' %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/admin_pages.js?v=5"></script>
  <script src="/static/js/mobile_app.js?v=2"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
