<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#6d2854">
  <title>تسجيل الدخول — صوف</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png?v=6">
  <link rel="icon" href="/static/icons/icon-192.png?v=6">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/dashboard.css?v=17">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card">
      <div class="login-brand-mark"><img src="/static/icons/icon-192.png?v=6" alt="شعار صوف"></div>
      <p class="login-kicker">لوحة المبيعات الذكية</p>
      <h1>صوف</h1>
      <p class="login-copy">أديري المحادثات والطلبات والمنتجات من مكان واحد.</p>
      {% if error %}<div class="login-error"><i class="bi bi-exclamation-circle"></i>{{ error }}</div>{% endif %}
      <form method="post" class="login-form">
        <label for="password">كلمة المرور</label>
        <div class="login-password-wrap">
          <i class="bi bi-shield-lock"></i>
          <input id="password" name="password" type="password" autocomplete="current-password" required autofocus placeholder="أدخل كلمة المرور">
          <button type="button" onclick="togglePassword()" aria-label="إظهار كلمة المرور"><i class="bi bi-eye" id="passwordEye"></i></button>
        </div>
        <label class="login-remember"><input type="checkbox" name="remember" value="1" checked> إبقائي مسجلًا على هذا الجهاز</label>
        <button class="login-submit" type="submit"><span>دخول إلى النظام</span><i class="bi bi-arrow-left"></i></button>
      </form>
      <small>دخول آمن بجلسة محفوظة لمدة 30 يومًا</small>
    </section>
  </main>
  <script>
    function togglePassword(){const input=document.getElementById('password');const eye=document.getElementById('passwordEye');input.type=input.type==='password'?'text':'password';eye.className=input.type==='password'?'bi bi-eye':'bi bi-eye-slash';}
  </script>
</body>
</html>
